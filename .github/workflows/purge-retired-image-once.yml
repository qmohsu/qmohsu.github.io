name: Purge retired IPNL image once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Purge the retired image URL
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          token = os.environ.get('CF_TOKEN', '')
          account = os.environ.get('CF_ACCOUNT', '')
          if not token:
              print('Existing deployment token unavailable.')
              sys.exit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def call(path, payload=None):
              request = urllib.request.Request(
                  'https://api.cloudflare.com/client/v4' + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
                  method='GET' if payload is None else 'POST')
              try:
                  with opener.open(request, timeout=30) as response:
                      status, data = response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  status = error.code
                  try:
                      data = json.loads(error.read())
                  except (ValueError, UnicodeDecodeError):
                      data = {}
              except Exception:
                  print('Cloudflare request failed; credentials were not logged.')
                  sys.exit(1)
              print(json.dumps({'http_status': status, 'success': data.get('success', False),
                                'error_codes': [e.get('code') for e in data.get('errors', [])]}))
              return data
          zones = call('/zones?name=ipnl.io&status=active')
          matches = [z for z in zones.get('result', []) if z.get('name') == 'ipnl.io'] if isinstance(zones.get('result'), list) else []
          zone = matches[0].get('id') if len(matches) == 1 else None
          if not zone and re.fullmatch(r'[a-f0-9]{32}', account):
              domains = call('/accounts/' + account + '/pages/projects/ipnl/domains')
              matches = [d for d in domains.get('result', []) if d.get('name') == 'ipnl.io'] if isinstance(domains.get('result'), list) else []
              zone = matches[0].get('zone_tag') if len(matches) == 1 else None
          if not isinstance(zone, str) or not re.fullmatch(r'[a-f0-9]{32}', zone):
              print('Cannot resolve the exact ipnl.io zone with existing deployment access.')
              sys.exit(1)
          result = call('/zones/' + zone + '/purge_cache', {
              'files': ['https://ipnl.io/images/news/2019-ion-pacific-pnt-honolulu-keynote-03.jpg']})
          if result.get('success') is not True:
              print('Existing deployment access cannot purge this URL.')
              sys.exit(1)
          print('Retired image URL purge accepted.')
          PY
